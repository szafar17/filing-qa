name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly; only the optional live-API job uses this

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filingqa
          POSTGRES_PASSWORD: filingqa
          POSTGRES_DB: filingqa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filingqa -d filingqa_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FILINGQA_TEST_DATABASE_URL: postgresql://filingqa:filingqa@localhost:5432/filingqa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit + integration against pgvector)
        run: pytest -q

  # Offline eval on the committed SYNTHETIC mini corpus and mini golden set, with the
  # hashing embedder, lexical reranker and fake LLM (no API keys, no downloads).
  # Fails the build if retrieval/answer metrics drop below eval/thresholds.offline.json.
  offline-eval:
    needs: lint-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filingqa
          POSTGRES_PASSWORD: filingqa
          POSTGRES_DB: filingqa_offline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filingqa -d filingqa_offline"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FILINGQA_DATABASE_URL: postgresql://filingqa:filingqa@localhost:5432/filingqa_offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Index the synthetic mini corpus
        run: |
          python -m filingqa.store --config config/offline.yaml migrate
          python -m filingqa.ingest --config config/offline.yaml local tests/fixtures/corpus
          python -m filingqa.ingest --config config/offline.yaml embed
      - name: Smoke eval + regression gate
        run: python -m filingqa.eval --config config/offline.yaml --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval-results
          path: results/offline/

  # Secrets cannot appear in a job-level `if`, so expose their presence as outputs.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.check.outputs.live }}
    steps:
      - id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$SEC_USER_AGENT" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

  # Optional: the real eval over the human-verified golden set, run manually or weekly,
  # only when OPENAI_API_KEY and SEC_USER_AGENT secrets exist. It downloads just the
  # filings the golden set cites (cached), so its corpus is smaller than the full
  # 500+ filing index and its numbers are NOT the official ones; it is a regression gate
  # against eval/thresholds.ci.json (baseline that file from this job's first run).
  live-eval:
    needs: [offline-eval, check-secrets]
    if: >-
      needs.check-secrets.outputs.live == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filingqa
          POSTGRES_PASSWORD: filingqa
          POSTGRES_DB: filingqa_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filingqa -d filingqa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FILINGQA_DATABASE_URL: postgresql://filingqa:filingqa@localhost:5432/filingqa_ci
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch for the cross-encoder)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[local]"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: sec-filings-${{ hashFiles('eval/golden.jsonl') }}
          restore-keys: sec-filings-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/default.yaml') }}
      - name: Build the golden-subset index
        run: |
          python -m filingqa.store migrate
          python -m filingqa.ingest from-golden
          python -m filingqa.ingest index
          python -m filingqa.ingest embed
      - name: Eval + regression gate
        run: python -m filingqa.eval --thresholds eval/thresholds.ci.json --results-dir results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-results
          path: results/ci/
