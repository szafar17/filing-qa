[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-qa"
version = "0.1.0"
description = "Cited RAG over SEC 10-K/10-Q filings: section-aware chunking, hybrid BM25 + pgvector retrieval, cross-encoder reranking, and a gated eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "lxml>=5.0",
  "openai>=1.40,<4",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local (offline) embedding model and cross-encoder reranker. Pulls in torch.
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["filingqa*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "results", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: needs Postgres + pgvector (set FILINGQA_TEST_DATABASE_URL)",
]
