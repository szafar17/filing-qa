# Production-style config: OpenAI embeddings + LLM, local cross-encoder reranker.
# Any key left out falls back to the defaults in filingqa/config.py.

database:
  # Overridden by the FILINGQA_DATABASE_URL environment variable when set.
  url: postgresql://filingqa:filingqa@localhost:5433/filingqa

ingest:
  companies_file: config/companies.yaml
  forms: ["10-K", "10-Q"]
  # Filing-date window. ~100 companies x (1-2 10-Ks + ~4-5 10-Qs) is roughly 600 filings.
  start_date: "2023-07-01"
  end_date: "2024-12-31"
  include_amendments: false
  raw_dir: data/raw
  max_requests_per_second: 8      # SEC fair-access limit is 10/s; stay under it
  max_workers: 4

chunking:
  target_chars: 1600
  max_chars: 2400
  overlap_chars: 200
  min_chars: 200

embedding:
  provider: openai
  model: text-embedding-3-small
  batch_size: 128

llm:
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.0
  max_output_tokens: 700
  timeout_s: 30
  max_retries: 4

reranker:
  provider: cross-encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 32
  max_length: 512

retrieval:
  mode: hybrid_rerank
  top_k: 5                 # passages handed to the LLM
  candidates: 50           # per retriever before fusion
  rerank_candidates: 30    # fused candidates scored by the cross-encoder
  rrf_k: 60
  bm25_k1: 1.2
  bm25_b: 0.75
  hnsw_ef_search: 100

refusal:
  # Refuse before calling the LLM when the best evidence is weaker than this.
  # Starting points only; calibrate with the threshold sweep in results/latest.md.
  min_rerank_score: 0.10       # sigmoid(cross-encoder logit)
  min_vector_similarity: 0.25  # cosine similarity, used when no reranker runs

eval:
  golden_path: eval/golden.jsonl
  thresholds_path: eval/thresholds.json
  results_dir: results
  modes: [vector, bm25, hybrid, hybrid_rerank]
  answer_modes: [hybrid_rerank]
  ks: [1, 5, 10]
  min_verified: 100
  judge:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.0
    max_output_tokens: 1200

prices_file: config/prices.yaml
